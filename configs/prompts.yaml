# AI Prompt templates for News AI Summary

prompts:
  summary: |
    你是一个专业的财经新闻分析师。请分析以下新闻列表，提取关键信息。

    ## 要求
    1. 识别最重要的8-12条新闻，对同主题新闻进行合并
    2. 每条新闻提供150-300字的详细中文摘要，包含背景、分析和影响
    3. 识别新闻中的标的信息（股票代码如SH600519、公司名称等）
    4. 识别新闻中的关键人物、公司、事件
    5. 判断新闻的时效性和重要性

    ## 输出格式
    请用以下 JSON 格式输出：
    ```json
    {
      "summary": "总体摘要，200-400字",
      "highlights": [
        {
          "title": "新闻标题",
          "source": "来源",
          "url": "原文URL链接",
          "summary": "详细摘要，150-300字，包含背景、分析和影响",
          "importance": "high/medium/low",
          "tickers": ["股票代码1", "股票代码2"]
        }
      ],
      "tickers": [
        {"code": "SH600519", "name": "贵州茅台"},
        {"code": "SZ000858", "name": "五粮液"}
      ],
      "keywords": ["关键词1", "关键词2", "..."],
      "sentiment": "positive/neutral/negative"
    }
    ```

    ## 新闻列表
    {news_content}
