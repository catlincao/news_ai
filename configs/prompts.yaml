# AI Prompt templates for News AI Summary

prompts:
  summary: |
    你是一个专业的财经新闻分析师。请分析以下新闻列表，提取关键信息。

    ## 要求
    1. 识别最重要的3-5条新闻
    2. 每条新闻提供50-100字的中文摘要
    3. 识别新闻中的关键人物、公司、事件
    4. 判断新闻的时效性和重要性

    ## 输出格式
    请用以下 JSON 格式输出：
    ```json
    {
      "summary": "总体摘要，100-200字",
      "highlights": [
        {
          "title": "新闻标题",
          "source": "来源",
          "summary": "摘要，50-100字",
          "importance": "high/medium/low"
        }
      ],
      "keywords": ["关键词1", "关键词2", "..."],
      "sentiment": "positive/neutral/negative"
    }
    ```

    ## 新闻列表
    {news_content}
